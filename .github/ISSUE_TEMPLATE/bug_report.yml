name: Bug report
description: Report a reproducible bug in Núcleo AI.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove personal data, API keys, OAuth tokens, private repository content, and signing secrets from all attachments."
  - type: input
    id: version
    attributes:
      label: App version
      description: "For example: 0.7.1-alpha."
      placeholder: "0.7.1-alpha"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android version; device model"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the shortest reliable sequence.
      placeholder: "1. Open… 2. Tap… 3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: "Optional screenshots, logs, or GitHub Actions run link. Do not attach secrets or private source."
    validations:
      required: false
