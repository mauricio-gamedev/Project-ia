name: Bootstrap and build Núcleo AI

on:
  push:
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nucleo-ai-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/nucleo-ai-source.tar.xz
          echo "cdfd489fda42464a53c05c7061880b6b9eea8749b40968fb294cbe8a3cda658b  /tmp/nucleo-ai-source.tar.xz" | sha256sum --check
          xz --test /tmp/nucleo-ai-source.tar.xz
          mkdir -p /tmp/nucleo-ai-source
          tar -xJf /tmp/nucleo-ai-source.tar.xz -C /tmp/nucleo-ai-source
          test -f /tmp/nucleo-ai-source/nucleo-ai-android/settings.gradle.kts
          test -f /tmp/nucleo-ai-source/nucleo-ai-android/app/build.gradle.kts

      - name: Import source tree into repository root
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/nucleo-ai-source/nucleo-ai-android/ "$GITHUB_WORKSPACE/"
          rm -rf bootstrap /tmp/nucleo-ai-source /tmp/nucleo-ai-source.tar.xz
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: import Núcleo AI Android source"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
          echo "## Núcleo AI debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: `$(sha256sum "$apk" | cut -d ' ' -f 1)`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-ai-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
